<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WYSIWYG Editor — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      transition: background .2s, color .2s;
    }
    body.dark { background: #111827; color: #f9fafb; }
    .demo-header {
      max-width: 960px;
      margin: 0 auto 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .demo-header h1 { margin: 0; font-size: 20px; }
    .demo-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .dbtn {
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }
    body.dark .dbtn { background: #1f2937; border-color: #374151; color: #f9fafb; }
    .dbtn:hover { background: #f9fafb; }
    body.dark .dbtn:hover { background: #374151; }
    #editor-wrap { max-width: 960px; margin: 0 auto; }
    #output {
      max-width: 960px;
      margin: 12px auto 0;
      background: white;
      border-radius: 8px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    body.dark #output { background: #1f2937; color: #f9fafb; }
    .tips {
      max-width: 960px;
      margin: 12px auto 0;
      font-size: 12px;
      color: #6b7280;
    }
    body.dark .tips { color: #9ca3af; }
    kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      padding: 1px 5px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #fff;
    }
    body.dark kbd { background: #1f2937; border-color: #374151; }
  </style>
</head>
<body>
  <div class="demo-header">
    <h1>WYSIWYG Editor</h1>
    <div class="demo-controls">
      <button type="button" class="dbtn" onclick="toggleTheme()">Dark Mode</button>
      <button type="button" class="dbtn" onclick="show('html')">HTML</button>
      <button type="button" class="dbtn" onclick="show('md')">Markdown</button>
      <button type="button" class="dbtn" onclick="show('json')">JSON</button>
      <button type="button" class="dbtn" onclick="editor.setLocale('de')">DE</button>
      <button type="button" class="dbtn" onclick="editor.setLocale('en')">EN</button>
      <button type="button" class="dbtn" onclick="hideOut()">Output aus</button>
    </div>
  </div>

  <div id="editor-wrap">
    <div id="editor"></div>
  </div>
  <pre id="output"></pre>
  <p class="tips">
    Tippe <kbd>/</kbd> am Zeilenanfang für Slash-Commands · <kbd>Ctrl+/</kbd> für alle Shortcuts · <kbd>F11</kbd> Vollbild.
    Diese Datei läuft ohne Build-Server — einfach im Browser öffnen.
  </p>

  <script>
    const editor = WysiwygEditor.createEditor({
      container: document.getElementById('editor'),
      initialHTML: `<h1>Willkommen zum WYSIWYG Editor</h1>
<p>Ein vollständig <strong>custom gebauter</strong> Rich-Text-Editor — kein TipTap, kein ProseMirror, kein Quill. Alles von Grund auf in <em>TypeScript</em> entwickelt.</p>
<h2>Features</h2>
<ul>
  <li><strong>25 Plugins</strong>: Formatierung, Tabellen, Bilder, Videos, Task-Listen, Slash-Commands, …</li>
  <li>Dark Mode, Light Mode, Auto-Mode</li>
  <li>Export als HTML, Markdown und JSON</li>
  <li>Vollbild-Modus (F11)</li>
  <li>Wörter- und Zeichenzähler</li>
  <li>Suchen &amp; Ersetzen (Ctrl+Shift+F)</li>
</ul>
<h2>Probiere es aus</h2>
<p>Tippe <code>/</code> am Zeilenanfang für die <strong>Slash-Command-Palette</strong> oder markiere Text für die <strong>Floating Toolbar</strong>.</p>`,
      placeholder: 'Hier schreiben…',
      theme: 'light',
      floatingToolbar: true,
      onChange: () => {
        if (document.getElementById('output').style.display !== 'none') show(_lastFormat);
      },
    });

    let _lastFormat = 'html';
    function show(fmt) {
      _lastFormat = fmt;
      const out = document.getElementById('output');
      out.style.display = 'block';
      if (fmt === 'html') out.textContent = editor.getHTML();
      else if (fmt === 'md') out.textContent = editor.getMarkdown();
      else out.textContent = JSON.stringify(editor.getJSON(), null, 2);
    }
    function hideOut() {
      document.getElementById('output').style.display = 'none';
    }
    function toggleTheme() {
      document.body.classList.toggle('dark');
      editor.setTheme(document.body.classList.contains('dark') ? 'dark' : 'light');
    }
  </script>
</body>
